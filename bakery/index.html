<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ButterVeil Bakery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>ButterVeil Bakery</h1>
    <p class="tagline">Made with love, freshly baked every morning</p>
  </header>

  <div class="controls">
    <input
      type="text"
      id="search-bar"
      placeholder="Search desserts…"
      aria-label="Search desserts"/>
    <button class="filter-btn" id="btn-gluten-free" aria-pressed="false">
      Gluten-Free
    </button>
    <button class="filter-btn" id="btn-low-fat" aria-pressed="false">
      Low Fat
    </button>
  </div>

  <main>
    <div id="card-grid">
      <p class="no-results">Loading desserts…</p>
    </div>
  </main>

  <footer>
    <p>ButterVeil Bakery · Baked with butter & a little magic</p>
  </footer>
  <script src="database.js"></script>
  <script src="main.js"></script>

</body>
</html>
